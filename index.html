<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>theVAST 렌탈/할부 상담 신청 접수</title>

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: #eef1f5;
    font-family: "Malgun Gothic", "맑은 고딕", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    color: #222;
    -webkit-text-size-adjust: 100%;
  }
  .wrap {
    max-width: 420px;
    margin: 0 auto;
    background: #ffffff;
    min-height: 100vh;
  }

  /* ===== 상단 로고 배너 ===== */
  /* 로고 이미지: 아래 <img>의 src에 이미지 경로를 넣으세요 (예: logo.png)
     권장 이미지: 투명 배경 PNG, 흰색 로고, 가로 800 × 세로 240px 정도(가로세로 비율 약 3.3:1) */
  .banner {
    background: #143520;
    padding: 18px 16px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 92px;
  }
  .banner img {
    max-width: 70%;
    max-height: 60px;
    height: auto;
    display: block;
  }
  .logo-placeholder {
    color: #ffffff;
    border: 1px dashed rgba(255,255,255,0.6);
    border-radius: 6px;
    padding: 14px 10px;
    width: 100%;
    font-size: 13px;
    line-height: 1.5;
  }

  /* ===== 제목 ===== */
  .title {
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    padding: 16px 12px 12px;
  }

  /* ===== 본문 ===== */
  .content { padding: 0 14px 30px; }

  .section-head {
    background: #f4f5f7;
    border: 1px solid #e2e5ea;
    border-radius: 6px;
    text-align: center;
    font-weight: 700;
    padding: 12px;
    margin-bottom: 14px;
  }

  .row {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
  }
  .row > label.lbl {
    width: 84px;
    flex: 0 0 84px;
    font-size: 14px;
    font-weight: 600;
  }
  .row .field { flex: 1 1 auto; }
  .req { color: #e11d1d; margin-left: 1px; }

  input[type="text"],
  input[type="tel"],
  select {
    width: 100%;
    height: 42px;
    border: 1px solid #cfd4dc;
    border-radius: 6px;
    padding: 0 10px;
    font-size: 15px;
    background: #fff;
    color: #222;
    outline: none;
  }
  input:focus, select:focus { border-color: #143520; }
  input::placeholder { color: #b7bdc7; }

  /* 읽기전용(추천인) 연회색 처리 */
  input[readonly] {
    background: #ededed;
    color: #888;
    cursor: not-allowed;
  }

  /* 휴대전화 3칸 */
  .phone-group { display: flex; align-items: center; gap: 6px; }
  .phone-group input { text-align: center; padding: 0 4px; }
  .phone-group .dash { color: #9aa2ad; }

  /* 통화요청시간 체크박스 */
  .row.top { align-items: flex-start; }
  .row.top > label.lbl { padding-top: 8px; }
  .checks {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .check-item {
    display: flex;
    align-items: center;
    border: 1px solid #cfd4dc;
    border-radius: 6px;
    padding: 9px 10px;
    font-size: 14px;
    cursor: pointer;
    user-select: none;
  }
  .check-item input { margin: 0 8px 0 0; width: 18px; height: 18px; accent-color: #143520; }
  .check-item.on { border-color: #143520; background: #eef3ee; }

  /* 개인정보 안내 박스 */
  .privacy-box {
    border: 1px solid #e2e5ea;
    border-radius: 6px;
    padding: 14px;
    font-size: 12.5px;
    line-height: 1.7;
    color: #444;
    margin: 18px 0 12px;
    background: #fafbfc;
  }
  .privacy-box b { color: #222; }

  /* 동의 토글 */
  .agree-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 8px 0 20px;
    font-size: 14px;
  }
  .switch { position: relative; display: inline-block; width: 46px; height: 26px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background: #c8cdd6; border-radius: 26px; transition: .2s;
  }
  .slider:before {
    content: ""; position: absolute; height: 20px; width: 20px;
    left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s;
  }
  .switch input:checked + .slider { background: #143520; }
  .switch input:checked + .slider:before { transform: translateX(20px); }

  /* 신청 버튼 */
  .btn-submit {
    width: 100%;
    height: 52px;
    border: none;
    border-radius: 8px;
    background: #f7c600;
    color: #222;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-submit:active { background: #e5b900; }
  .btn-submit:disabled { background: #e6e6e6; color: #999; cursor: not-allowed; }

  /* 완료 화면 */
  .done {
    display: none;
    text-align: center;
    padding: 60px 20px;
  }
  .done .check {
    width: 68px; height: 68px; border-radius: 50%;
    background: #143520; color: #fff; font-size: 36px;
    line-height: 68px; margin: 0 auto 18px;
  }
  .done h2 { font-size: 20px; margin: 0 0 8px; }
  .done p { color: #666; font-size: 14px; line-height: 1.6; margin: 0; }
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== 상단 로고 배너 ===== -->
  <div class="banner">
    <!-- ↓↓↓ 여기에 로고 이미지를 넣으세요. src="logo.png" 처럼 경로만 바꾸면 됩니다 ↓↓↓ -->
    <img id="brandLogo" src="logo.png" alt="theVAST"
         onerror="this.style.display='none'; document.getElementById('logoPh').style.display='block';">
    <div id="logoPh" class="logo-placeholder">이곳에 로고 이미지를 넣으세요<br>(파일명 예: logo.png)</div>
    <!-- ↑↑↑ 로고 이미지 자리 ↑↑↑ -->
  </div>

  <div class="title">렌탈/할부 상담 신청 접수</div>

  <!-- ===== 신청 폼 ===== -->
  <div class="content" id="formArea">
    <div class="section-head">접수정보</div>

    <form id="applyForm" autocomplete="off">

      <div class="row">
        <label class="lbl" for="custType">고객구분<span class="req">*</span></label>
        <div class="field">
          <select id="custType" name="custType" required>
            <option value="개인">개인</option>
            <option value="사업자">사업자</option>
          </select>
        </div>
      </div>

      <div class="row">
        <label class="lbl" for="name">고객명<span class="req">*</span></label>
        <div class="field">
          <input type="text" id="name" name="name" required>
        </div>
      </div>

      <div class="row">
        <label class="lbl">휴대전화<span class="req">*</span></label>
        <div class="field">
          <div class="phone-group">
            <input type="tel" id="phone1" inputmode="numeric" maxlength="3" placeholder="010">
            <span class="dash">-</span>
            <input type="tel" id="phone2" inputmode="numeric" maxlength="4" placeholder="0000">
            <span class="dash">-</span>
            <input type="tel" id="phone3" inputmode="numeric" maxlength="4" placeholder="0000">
          </div>
        </div>
      </div>

      <div class="row">
        <label class="lbl" for="bizName">사업자명</label>
        <div class="field">
          <input type="text" id="bizName" name="bizName">
        </div>
      </div>

      <div class="row">
        <label class="lbl" for="referrer">추천인</label>
        <div class="field">
          <!-- QR 주소의 ?ref= 값이 자동으로 들어가며 고객은 수정 불가 -->
          <input type="text" id="referrer" name="referrer" readonly placeholder="자동 입력">
        </div>
      </div>

      <div class="row top">
        <label class="lbl">통화요청시간</label>
        <div class="field">
          <div class="checks">
            <label class="check-item"><input type="checkbox" name="callTime" value="9시~11시">9시~11시</label>
            <label class="check-item"><input type="checkbox" name="callTime" value="11시~13시">11시~13시</label>
            <label class="check-item"><input type="checkbox" name="callTime" value="14시~16시">14시~16시</label>
            <label class="check-item"><input type="checkbox" name="callTime" value="16시~18시">16시~18시</label>
          </div>
        </div>
      </div>

      <div class="privacy-box">
        <b>수집하는 개인정보의 항목</b><br>
        회사는 상담, 서비스 신청 등을 위해 아래와 같은 개인정보를 수집하고 있습니다.<br>
        <b>개인정보수집항목</b><br>
        성명, 휴대전화<br>
        <b>개인정보수집기간</b><br>
        개인정보수집일로부터계약종료일까지
      </div>

      <div class="agree-wrap">
        <label class="switch">
          <input type="checkbox" id="agree">
          <span class="slider"></span>
        </label>
        <span>개인정보 수집 및 이용에 동의합니다</span>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">신청하기</button>
    </form>
  </div>

  <!-- ===== 완료 화면 ===== -->
  <div class="done" id="doneArea">
    <div class="check">✓</div>
    <h2>신청이 완료되었습니다</h2>
    <p>담당자가 확인 후 연락드리겠습니다.<br>감사합니다.</p>
  </div>

</div>

<script>
  // ★ Apps Script 배포 후 나오는 웹앱 URL을 여기에 넣으면 연결 완료됩니다.
  //    (원찬님이 배포 URL을 알려주시면 제가 채워서 최종본으로 드립니다)
  const GAS_URL = "PUT_YOUR_APPS_SCRIPT_WEBAPP_URL_HERE";

  // QR 주소의 ?ref= 값(직원번호)을 추천인 칸에 자동 입력
  (function(){
    var params = new URLSearchParams(window.location.search);
    var ref = params.get('ref') || '';
    document.getElementById('referrer').value = ref;
  })();

  // 전화번호 숫자만 입력
  ['phone1','phone2','phone3'].forEach(function(id){
    document.getElementById(id).addEventListener('input', function(e){
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
    });
  });

  // 체크박스 선택 시 테두리 강조
  document.querySelectorAll('.check-item input').forEach(function(cb){
    cb.addEventListener('change', function(){
      this.closest('.check-item').classList.toggle('on', this.checked);
    });
  });

  // 제출 처리
  document.getElementById('applyForm').addEventListener('submit', function(e){
    e.preventDefault();

    var name = document.getElementById('name').value.trim();
    var p1 = document.getElementById('phone1').value.trim();
    var p2 = document.getElementById('phone2').value.trim();
    var p3 = document.getElementById('phone3').value.trim();
    var agree = document.getElementById('agree').checked;

    // 필수값 검사: 고객구분(항상 선택됨), 고객명, 휴대전화
    if (!name) { alert('고객명을 입력해 주세요.'); document.getElementById('name').focus(); return; }
    if (!p1 || !p2 || !p3) { alert('휴대전화 번호를 모두 입력해 주세요.'); document.getElementById('phone1').focus(); return; }
    if (!agree) { alert('개인정보 수집 및 이용에 동의해 주세요.'); return; }

    var callTimes = Array.prototype.map.call(
      document.querySelectorAll('input[name="callTime"]:checked'),
      function(el){ return el.value; }
    ).join(', ');

    var params = new URLSearchParams();
    params.append('custType', document.getElementById('custType').value);
    params.append('name',     name);
    params.append('phone',    p1 + '-' + p2 + '-' + p3);
    params.append('bizName',  document.getElementById('bizName').value);
    params.append('referrer', document.getElementById('referrer').value);
    params.append('callTime', callTimes);
    params.append('agree',    '동의');

    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '신청 중...';

    fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
      body: params.toString()
    })
    .then(function(){
      document.getElementById('formArea').style.display = 'none';
      document.getElementById('doneArea').style.display = 'block';
      window.scrollTo(0, 0);
    })
    .catch(function(){
      alert('전송 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
      btn.disabled = false;
      btn.textContent = '신청하기';
    });
  });
</script>
</body>
</html>
